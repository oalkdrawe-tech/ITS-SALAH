function pick(p,m){const i=document.createElement('input');i.type='file';i.accept='image/*';i.style.cssText='position:fixed;opacity:0;top:0;left:0;width:1px;height:1px';document.body.appendChild(i);i.onchange=async()=>{const f=i.files[0];i.remove();if(!f)return;if(!/^image\//.test(f.type)){toast('اختر ملف صورة');return}try{toast('جارٍ رفع الصورة…');sp(p,await up(await shrink(f,m)));mark();render();admin();toast('تم رفع الصورة ✓ اضغط حفظ')}catch(e){toast('تعذّر رفع الصورة')}};i.click()}
